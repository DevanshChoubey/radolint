# pre-commit hooks for radolint. Use them from .pre-commit-config.yaml:
#
#   - repo: https://github.com/DevanshChoubey/radolint
#     rev: v0.2.1
#     hooks:
#       - id: radolint
#
# `radolint` downloads the release binary that matches `rev` on first use (no Docker, Rust or
# Python needed). `radolint-system` runs whatever radolint is on PATH instead.
- id: radolint
  name: Lint Dockerfiles with radolint
  description: Lint Dockerfiles with radolint, a fast hadolint-compatible linter. Downloads the matching release binary on first use.
  entry: packaging/pre-commit/run-radolint.sh
  language: script
  types: [dockerfile]
- id: radolint-system
  name: Lint Dockerfiles with radolint (from PATH)
  description: Lint Dockerfiles with the radolint already installed on PATH.
  entry: radolint
  language: system
  types: [dockerfile]
