[package]
name = "radolint-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Fast Dockerfile linter: a drop-in hadolint replacement written in Rust"
keywords = ["hadolint", "dockerfile", "linter", "lint", "shellcheck"]
categories = ["command-line-utilities", "development-tools"]
readme = "../../README.md"

[[bin]]
name = "radolint"
path = "src/main.rs"

[dependencies]
radolint-core.workspace = true
radolint-syntax.workspace = true
radolint-parser.workspace = true

[lints]
workspace = true

# musl's allocator makes the static Linux release binaries several times
# slower under threads; use mimalloc there instead.
[target.'cfg(target_env = "musl")'.dependencies]
mimalloc = { version = "0.1", default-features = false }
